name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Swift 6.1 / Linux
    runs-on: ubuntu-latest
    container: swift:6.1
    # A planner bug that stopped the wave loop making progress used to be an unbounded
    # loop. It is now caught by an assertion instead, but a timeout costs nothing and
    # turns any future variant into a fast red X rather than a six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # A warning is a failure. This flag is the reason the README is allowed to claim
      # "no warnings" — otherwise it would be a sentence nobody had checked.
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

  apple:
    # The Linux job cannot see ConcurrencyMigrationKitUI at all: the whole file is inside
    # `#if canImport(SwiftUI)`, so on Linux it compiles to an empty module. Without this
    # job every line of the SwiftUI target would be unverified by any compiler.
    name: iOS Simulator build (compiles the SwiftUI target)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build both products for the iOS Simulator
        run: |
          xcodebuild build \
            -scheme ConcurrencyMigrationKit-Package \
            -destination 'generic/platform=iOS Simulator'

      # Package.swift declares macOS, so something has to build it. Two SwiftUI modifiers
      # in the dashboard are `@available(macOS, unavailable)` and are `#if os(iOS)`-guarded
      # for exactly this reason; without this step that guard could rot unnoticed and
      # `swift build` would break for anyone on a Mac.
      - name: Build and test for macOS
        run: swift test
